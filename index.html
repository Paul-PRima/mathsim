<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mathsim</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='13' cy='16' r='9' fill='%237c5cff'/><circle cx='24' cy='16' r='4' fill='%2336d1dc'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="shell">
  <nav id="rail" aria-label="Sections"></nav>
  <main id="modules">
  <section id="mod-home" class="module" hidden></section>
  <section id="mod-calc" class="module" hidden></section>
  <section id="mod-graph" class="module" hidden></section>
  <section id="mod-stats" class="module" hidden></section>
  <section id="mod-matrix" class="module" hidden></section>
  <section id="mod-tools" class="module" hidden></section>
  <section id="mod-surface" class="module" hidden></section>
  <section id="mod-geometry" class="module" hidden></section>
  <section id="mod-probability" class="module" hidden></section>
  <section id="mod-practice" class="module" hidden></section>
  <section id="mod-simulations" class="module" hidden></section>
  <div id="app" class="module" hidden>
    <aside id="panel">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span>Fractals</span>
        <button id="btn-hide" class="icon" title="Hide panel (H)" onclick="document.getElementById('app').classList.add('panel-hidden')">⟨</button>
      </div>
      <nav class="tabs">
        <button data-tab="render" class="active">Render</button>
        <button data-tab="maker">Maker</button>
        <button data-tab="library">Library</button>
      </nav>
      <div class="tab-body">
        <section id="tab-render" class="tab active"></section>
        <section id="tab-maker" class="tab"></section>
        <section id="tab-library" class="tab"></section>
      </div>
    </aside>

    <main id="stage">
      <canvas id="gl-canvas" class="main-canvas"></canvas>
      <canvas id="ifs-canvas" class="main-canvas" hidden></canvas>
      <canvas id="vec-canvas" class="main-canvas" hidden></canvas>
      <canvas id="c3-lo" class="main-canvas c3-lo" hidden></canvas>
      <canvas id="c3-hi" class="main-canvas" hidden></canvas>
      <div id="minimap" hidden>
        <canvas id="minimap-canvas" title="Mini-map — click to jump there (M to hide)"></canvas>
        <span id="minimap-label"></span>
      </div>
      <button id="btn-video" title="Record a zoom video of the current view">🎬 Zoom video</button>
      <div id="julia-inset" hidden>
        <canvas id="julia-canvas"></canvas>
        <span id="julia-label"></span>
      </div>
      <button id="btn-show" title="Show panel (H)">☰</button>
      <div id="hud">
        <span id="hud-coords"></span>
        <span id="hud-zoom"></span>
        <span id="hud-info"></span>
      </div>
      <div id="error-banner" hidden></div>
      <div id="progress" hidden><div class="bar"><i></i></div><span></span></div>
    </main>
  </div>
  </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/mathexpr.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/i18n-de.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/palettes.js"></script>
  <script src="js/formula.js"></script>
  <script src="js/hp.js"></script>
  <script src="js/deep.js"></script>
  <script src="js/escape.js"></script>
  <script src="js/ifs.js"></script>
  <script src="js/attractor.js"></script>
  <script src="js/vector.js"></script>
  <script src="js/fractal3d.js"></script>
  <script src="js/explore.js"></script>
  <script src="js/video.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/library.js"></script>
  <script src="js/app.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/calcx.js"></script>
  <script src="js/algebra.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/datafile.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/matrix.js"></script>
  <script src="js/symbolic.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/surface.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/probability.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/simulations.js"></script>
  <script>Shell.start();</script>
</body>
</html>
